version: "3.8"

services:
  # 1. API Service (FastAPI) — 2 replicas
  api:
    build:
      context: ..
      dockerfile: phase6/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis:6379/1
      - SANDBOX_BACKEND=docker
      - SANDBOX_IMAGE=lms-sandbox:latest
      - SANDBOX_TIMEOUT_SECONDS=8
      - SANDBOX_MEMORY_LIMIT_MB=128
      - METRICS_ENABLED=true
      - METRICS_PATH=/metrics
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/sovereign_lms
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  # 2. Worker Service (Arq Queue) — 4 replicas
  worker:
    build:
      context: ..
      dockerfile: phase6/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis:6379/1
      - SANDBOX_BACKEND=docker
      - SANDBOX_IMAGE=lms-sandbox:latest
      - SANDBOX_TIMEOUT_SECONDS=8
      - SANDBOX_MEMORY_LIMIT_MB=128
      - WORKER_CONCURRENCY=4
      - QUEUE_MAX_JOBS=50
      - QUEUE_JOB_TIMEOUT_SECONDS=15
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/sovereign_lms
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 4

  # 3. Redis Service — Dual logical databases (DB 0: cache, DB 1: queue)
  redis:
    image: redis:7-alpine
    container_name: sovereign_lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Postgres Service — Local development (Production points to Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: sovereign_lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sovereign_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sovereign_lms_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - api

  # 6. Grafana Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sovereign_lms_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis_data:
  pg_data:
  prometheus_data:
  grafana_data:
